const W=1120,H=460,ground=353,startX=125,bellX=990,speed=144;
const bridges=[[241,426],[640,842]],count=16,beat=.5,limit=count*beat;
const sample=Array.from({length:count},(_,i)=>i<7?1:2);
let mode='idle',paused=false,elapsed=0,visualTime=0,lastStamp=0,light=1;
let hasBoat=false,boatTrip=0;
let score=Array(count).fill(0),player=startX,direction=1,walkPhase=0;
let attempt=[],previous=[],oldScore=[],replayIndex=0,fault=null,fallTime=0,ringTime=0,shade=1,hoverBridge=0;
let audio=null,soundOn=false,modalFocus=null,saved=null;
const held=new Set(),slots=[];
try{const v=JSON.parse(localStorage.getItem('borrow-light-score-v1'));if(Array.isArray(v)&&v.length===count&&v.every(n=>n===1||n===2))saved=v;}catch{}
function tone(freq,duration=.16,volume=.05,delay=0){
 if(!soundOn||!audio)return;
 const at=audio.currentTime+delay,osc=audio.createOscillator(),gain=audio.createGain();
 osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.0001,at);
 gain.gain.exponentialRampToValueAtTime(volume,at+.015);gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
 osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+duration+.02);
}
function chime(){[784,1046.5,1318.5,1568].forEach((f,i)=>tone(f,.95,.055,i*.105));}
function beatIndex(t){return Math.min(count-1,Math.floor((t+1e-8)/beat));}
function chooseLight(n){if(mode!=='record'||paused)return;light=n;score[beatIndex(elapsed)]=n;drawTimeline();tone(n===1?392:523);markSelection();}
function record(){mode='record';elapsed=0;light=1;score=Array(count).fill(0);score[0]=1;player=startX;fault=null;previous=[];hasBoat=false;boatTrip=0;held.clear();show();tone(392);}
function ready(arr){score=arr.slice();mode='ready';elapsed=0;player=startX;light=score[0];fault=null;previous=[];hasBoat=false;boatTrip=0;held.clear();show();}
function startWalk(){if(!score.every(n=>n===1||n===2))return;mode='walk';player=startX;direction=1;elapsed=0;walkPhase=0;hasBoat=false;boatTrip=0;light=score[0];attempt=[{t:0,x:player}];held.clear();show();tone(523);}
function nearBoat(){return Math.abs(player-531)<=40&&!hasBoat&&boatTrip===0;}
function pickup(){if(mode==='walk'&&!paused&&nearBoat()){boatTrip=1.4;tone(598,.15);}}
function fail(reason,bridge=0){mode=reason==='time'?'edit':'fall';held.clear();previous=[...attempt,{t:elapsed,x:player}];oldScore=score.slice();fault={time:elapsed,bridge,reason,x:player};fallTime=0;if(mode==='edit')show();else{tone(174,.4);show();}}
function replay(){mode='replay';elapsed=Math.max(0,fault.time-2.5);replayIndex=0;player=startX;show();}
function finishReplay(){mode='edit';elapsed=fault.time;player=fault.x;light=oldScore[beatIndex(elapsed)];show();}
function win(){if(mode!=='walk'||player<bellX-26)return;mode='win';held.clear();previous=attempt.slice();ringTime=visualTime;chime();saved=score.slice();try{localStorage.setItem('borrow-light-score-v1',JSON.stringify(saved));}catch{}show();}
function makeBtn(text,fn,cls='ghost',id=''){const b=document.createElement('button');b.textContent=text;b.className=cls;if(id)b.id=id;b.onclick=fn;$('actions').append(b);return b;}
function movementButton(label,code){const b=makeBtn(label,()=>{},'key');b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(code)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>held.delete(code);return b;}
function markSelection(){for(const n of [1,2]){const b=$('b'+n);if(b){b.classList.toggle('selected',light===n);b.setAttribute('aria-pressed',light===n);}}}
function show(){

 makeBtn('开始录光  →',record,'primary');makeBtn('先玩示例',()=>ready(sample));if(saved)makeBtn('上次的光',()=>ready(saved));break;
 case 'record':title='你在楼上，正在录下这束光';tip='起初照着桥一。建议约 3.5 秒时按 2，给右边的桥留些光。也可点桥或按钮。';badge='掌灯 · 录制中';
 makeBtn('1　桥一',()=>chooseLight(1),'key','b1');makeBtn('2　桥二',()=>chooseLight(2),'key','b2');markSelection();break;
 case 'ready':title='灯光已就位，换你走一遍';tip='每格是半秒，点击可换桥。按「开始过桥」后，按住 → 或 D 走，石台上可以等。';badge='准备过桥';makeBtn('开始过桥  →',startWalk,'primary');makeBtn('重新录光',record);break;
 case 'walk':title='跟上楼上的自己';tip='按住 → 或 D 向右走。石台上按 E 可绕去拾纸船，耗时 1.4 秒；右岸按空格摇铃。';badge='行路 · 灯光回放';
 movementButton('◀ 左走','leftTouch');movementButton('右走 ▶','rightTouch');makeBtn('拾纸船',pickup,'key','boat');$('boat').disabled=true;makeBtn('摇风铃',win,'key','ring');$('ring').disabled=true;break;
 case 'fall':title='灯移开了，纸桥也收了起来';tip='看看自己在哪一拍离开了桥面。';badge='落水';break;
 case 'edit':title=fault?.reason==='time'?'八秒到了，再调一次节奏':'这半秒，你和灯错开了';tip=fault?.bridge?'在 '+fault.time.toFixed(1)+' 秒，你需要桥'+(fault.bridge===1?'一':'二')+'。橙色三角标出当时的位置；点色块改光，再试一次。':'点半秒色块切换桥梁，或者保持灯谱、早点出发。';badge='复盘 · 可改灯谱';makeBtn('再走一次  →',startWalk,'primary');makeBtn('回看刚才',replay);makeBtn('重新录光',record);break;
 case 'replay':title='再看一眼，你和灯错在哪一拍';tip='慢速重放刚才的脚步和当时的灯光。';badge='慢速回放';makeBtn('返回调光',finishReplay);break;
 case 'win':title=hasBoat?'风铃响了，你还带回了一只纸船。':'风铃响了。是刚才的你，送你过了桥。';tip=hasBoat?'把设备递给下一位，让对方走一次你的灯谱。':'还想再试？中间的石台藏着一只纸船。经过时按 E，看看能不能把它一起带回来。';badge=hasBoat?'已抵达 · 拾舟':'已抵达';makeBtn('再走这束光',()=>ready(score),'primary');makeBtn('再录一束光',record);break;
 }
 $('title').textContent=title;$('tip').textContent=tip;$('badge').textContent=badge;
 $('timeline-label').textContent=mode==='edit'||mode==='ready'?'八秒灯谱 · 点格子改光':'八秒灯谱';drawTimeline();
}
function drawTimeline(){
 const editable=mode==='edit'||mode==='ready';slots.forEach((b,i)=>{let n=(mode==='replay'?oldScore:score)[i];b.dataset.lit=n;b.disabled=!editable;b.textContent=n===1?'Ⅰ':n===2?'Ⅱ':'·';b.setAttribute('aria-label',(i*.5)+' 秒至 '+((i+1)*.5)+' 秒：'+(n===1?'桥一':n===2?'桥二':'待录制'));});
 $('fault').hidden=!(fault&&mode==='edit');if(fault)$('fault').style.left=(Math.min(99,fault.time/limit*100))+'%';
}
for(let i=0;i<count;i++){let b=document.createElement('button');b.className='slot';b.onclick=()=>{if(mode==='edit'||mode==='ready'){score[i]=score[i]===1?2:1;light=score[i];drawTimeline();tone(score[i]===1?392:523);}};slots.push(b);$('timeline').append(b);}
function modal(title,lines){if(paused)return;paused=true;held.clear();modalFocus=document.activeElement;$('overlay').hidden=false;$('dialog-title').textContent=title;$('dialog-body').replaceChildren(...lines.map(t=>{let p=document.createElement('p');p.textContent=t;return p}));$('resume').focus();}
function unpause(){if(!paused)return;paused=false;lastStamp=0;$('overlay').hidden=true;if(modalFocus?.isConnected)modalFocus.focus();}
$('help').onclick=()=>modal('怎么玩',['① 楼上掌灯。八秒里用 1 / 2 或点桥，录下灯光切换的节奏。每格半秒。','② 楼下行路。按住方向键，站在亮着的纸桥上过河。石台不会消失。八秒内走到右岸，按空格或点「摇风铃」。','③ 看见错位。落水后可直接改几格灯谱，也可保持原谱再走。Esc 暂停。']);
$('close').onclick=$('resume').onclick=unpause;
$('sound').onclick=()=>{try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});soundOn=!soundOn;$('sound').textContent='声音 · '+(soundOn?'开':'关');tone(659,.35);}catch{$('sound').textContent='声音不可用';}};
const gameKeys=['ArrowLeft','ArrowRight','KeyA','KeyD','KeyE','Digit1','Digit2','Space'];
window.addEventListener('keydown',e=>{if(e.code==='Escape'){e.preventDefault();if(paused)unpause();else modal('暂停片刻',['灯光和脚步都停在这里。']);return;}if(paused||!gameKeys.includes(e.code))return;
 if(mode==='record'&&['Digit1','Digit2'].includes(e.code)){e.preventDefault();if(!e.repeat)chooseLight(Number(e.code.slice(-1)));return;}
 if(mode==='walk'){e.preventDefault();held.add(e.code);if(e.code==='Space'&&!e.repeat)win();if(e.code==='KeyE'&&!e.repeat)pickup();}});
window.addEventListener('keyup',e=>held.delete(e.code));
window.addEventListener('blur',()=>{held.clear();if(!paused&&['record','walk'].includes(mode))modal('暂停片刻',['回到游戏后可以从刚才那一拍继续。']);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&['walk','record'].includes(mode))modal('暂停片刻',['切回页面后继续。']);});
function pointBridge(e){const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;return x<(bridges[0][1]+bridges[1][0])/2?1:2;}
canvas.onpointerdown=e=>{if(mode==='record'){canvas.setPointerCapture(e.pointerId);chooseLight(pointBridge(e));}};
canvas.onpointermove=e=>{hoverBridge=pointBridge(e);if(mode==='record'&&e.buttons===1&&light!==hoverBridge)chooseLight(hoverBridge);};
canvas.onpointerleave=()=>{hoverBridge=0;};
function update(dt){
 visualTime+=dt;
 if(mode==='record'){
 const before=beatIndex(elapsed);elapsed=Math.min(limit,elapsed+dt);
 const after=beatIndex(elapsed);for(let i=before+1;i<=after;i++)score[i]=light;
 if(before!==after)drawTimeline();if(elapsed>=limit){ready(score);return;}
 }else if(mode==='walk'){
 elapsed=Math.min(limit,elapsed+dt);light=score[beatIndex(elapsed)];
 const right=held.has('ArrowRight')||held.has('KeyD')||held.has('rightTouch');
 const left=held.has('ArrowLeft')||held.has('KeyA')||held.has('leftTouch');
 const movement=Number(right)-Number(left);
 if(boatTrip>0){boatTrip=Math.max(0,boatTrip-dt);if(boatTrip===0){hasBoat=true;tone(784,.3);}}
 else if(movement){direction=movement;walkPhase+=dt*10;player=Math.max(72,Math.min(1045,player+movement*speed*dt));}
 $('boat').disabled=!nearBoat();
 if(elapsed- attempt[attempt.length-1].t>.055)attempt.push({t:elapsed,x:player});
 const gap=bridges.findIndex(([a,b])=>player>a&&player<b);
 if(gap!==-1&&light!==gap+1){fail('dark',gap+1);return;}
 const near=player>=bellX-26;$('ring').disabled=!near;
 if(near&&$('title').textContent!=='到了，摇响风铃吧！'){$('title').textContent='到了，摇响风铃吧！';tone(880,.15);}
 if(!near&&$('title').textContent==='到了，摇响风铃吧！')$('title').textContent='跟上楼上的自己';
 if(elapsed>=limit){if(near){elapsed=limit;/* The safe bank keeps the bell available. */}else fail('time');}
 }else if(mode==='replay'){elapsed=Math.min(fault.time,elapsed+dt*.65);while(replayIndex+1<previous.length&&previous[replayIndex+1].t<=elapsed)replayIndex++;
 const p=previous[replayIndex];player=p.x;light=oldScore[beatIndex(elapsed)];if(elapsed>=fault.time)finishReplay();
 }else if(mode==='fall'){fallTime+=dt;if(fallTime>.75){mode='edit';show();}}
 shade+=(light-shade)*Math.min(1,dt*12);
}
// Paint the architecture once. Moving light, paper bridges, rain and players are independent layers.
function poly(c,points,color){c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();}
function stroke(c,points,color,width=1){c.strokeStyle=color;c.lineWidth=width;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
function ellipse(c,x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,2*Math.PI);c.fill();}
const scenery=document.createElement('canvas');scenery.width=W;scenery.height=H;
function architecture(){
 const c=scenery.getContext('2d');c.clearRect(0,0,W,H);let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#526578');g.addColorStop(1,'#263f4c');c.fillStyle=g;c.fillRect(0,0,W,H);
 if(plate.complete&&plate.naturalWidth){const scale=Math.max(W/plate.width,H/plate.height);c.drawImage(plate,(W-plate.width*scale)/2,(H-plate.height*scale)*.48,plate.width*scale,plate.height*scale);}
 c.fillStyle='#11273430';c.fillRect(0,0,W,H);
 const water=c.createLinearGradient(0,ground,0,H);water.addColorStop(0,'#2a4f6096');water.addColorStop(1,'#102e3fe8');c.fillStyle=water;c.fillRect(0,ground+16,W,H-ground);
 function bank(a,b){const bottom=ground+55;poly(c,[[a,ground],[b,ground],[b-3,bottom],[a,bottom]],'#192d38');for(let row=0;row<3;row++){for(let x=a-35+((row%2)*24);x<b;x+=52){const left=Math.max(x,a),right=Math.min(x+50,b);if(right<=left)continue;const y=ground+3+row*14;poly(c,[[left,y+1],[right,y],[right-1,y+12],[left+1,y+13]],['#4a5354','#495857','#515d5b','#3d5054'][(Math.abs(Math.floor(x))+row)%4]);}}
 c.fillStyle='#8c9284';c.fillRect(a,ground-3,b-a,5);stroke(c,[[a,ground-3],[b,ground-3]],'#c5b99b',1.3);}
 bank(0,241);bank(426,640);bank(842,W);
 // A little lamplighter's balcony on the left, opposite a warm receiving door.
 poly(c,[[0,151],[188,151],[177,164],[0,172]],'#252f34');stroke(c,[[0,150],[187,150]],'#c1a680',3);
 for(const x of [10,33,56,79,102,125,148,171]){stroke(c,[[x,151],[x,133]],'#394349',4);}stroke(c,[[0,131],[176,131]],'#968e7b',3);
 stroke(c,[[156,153],[168,173],[198,177]],'#614a35',5);
 poly(c,[[948,ground-3],[948,271],[957,256],[973,250],[989,256],[999,271],[999,ground-3]],'#644d37');
 poly(c,[[955,ground-3],[955,273],[964,260],[977,258],[989,271],[989,ground-3]],'#e6b265');c.fillStyle='#4d4841';c.fillRect(969,267,3,80);
 stroke(c,[[1000,269],[1025,269],[1025,276]],'#b59b6c',3);
}
plate.onload=architecture;architecture();
function character(x,y,scale,ghost,step,face=1){
 const c=ctx;c.save();c.translate(x,y);c.scale(scale*face,scale);if(ghost)c.globalAlpha=.8;
 const coat=ghost?'#9fc9d4':'#f5be5e',shadow=ghost?'#5c8594':'#b17c3d',ink=ghost?'#64818e':'#2c3236';
 const stride=Math.sin(step)*4;stroke(c,[[-4,-12],[-4-stride,0],[-7-stride,0]],ink,4);stroke(c,[[3,-12],[4+stride,-1],[7+stride,-1]],ink,4);
 poly(c,[[-6,-30],[2,-34],[9,-24],[11,-12],[4,-9],[-10,-11]],coat);poly(c,[[-6,-30],[-1,-26],[-5,-11],[-10,-11]],shadow);
 ellipse(c,0,-35,7,8,ghost?'#bdd9da':'#e4b68b');poly(c,[[-9,-35],[-8,-40],[-2,-45],[6,-43],[10,-37],[4,-38],[1,-33]],coat);
 poly(c,[[-3,-30],[4,-31],[8,-28],[0,-26],[-12,-23+Math.sin(visualTime*4)*1.5],[-18,-25],[-9,-26]],ghost?'#7ab0bf':'#dd7056');
 stroke(c,[[3,-25],[6,-20],[ghost?16:9,-22]],shadow,3);c.restore();}
function bridge(n){
 const [a,b]=bridges[n-1];const on=light===n;const c=ctx;c.save();const mid=(a+b)/2;
 if(on){c.shadowBlur=16;c.shadowColor='#fac65b';c.fillStyle='#f0c575';c.fillRect(a,ground-4,b-a,5);c.shadowBlur=0;
 poly(c,[[a,ground+1],[mid,ground+7],[b,ground+1],[b-8,ground+13],[mid,ground+19],[a+7,ground+13]],'#b89562');
 for(let x=a+6;x<b-5;x+=17){stroke(c,[[x,ground+3],[x+6,ground+11]],'#ddbb7b',1.5);}
 for(const x of [a+5,mid,b-5]){stroke(c,[[x,ground],[x,ground-14]],'#e4b66d',2);ellipse(c,x,ground-15,3,3,'#ffe2a1');}
 c.beginPath();c.moveTo(a+5,ground-14);c.quadraticCurveTo((a+mid)/2,ground-7,mid,ground-14);c.quadraticCurveTo((mid+b)/2,ground-7,b-5,ground-14);c.strokeStyle='#f8d58a';c.lineWidth=1.8;c.stroke();
 }else{c.setLineDash([3,6]);stroke(c,[[a,ground-1],[b,ground-1]],'#89bec2',1.6);c.setLineDash([]);}
 if(mode==='record'||mode==='idle'){c.fillStyle=on?'#ffd58d':'#b0cac8';c.font='bold 14px Georgia,serif';c.textAlign='center';c.fillText(n===1?'Ⅰ':'Ⅱ',mid,ground+40);}
 c.restore();
}
function draw(){
 const dpr=Math.min(window.devicePixelRatio||1,2),size=canvas.getBoundingClientRect();
 const width=Math.max(1,Math.round(size.width*dpr)),height=Math.max(1,Math.round(size.height*dpr));
 if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}ctx.setTransform(width/W,0,0,height/H,0,0);
 ctx.drawImage(scenery,0,0);const t=visualTime,c=ctx;
 for(let i=0;i<35;i++){const x=(i*97+t*6)%(W+30)-15,y=385+(i*17%75);stroke(c,[[x,y],[x+8+i%17,y]],'#acc4bc3b',1);}
 const dest=(bridges[0][0]+bridges[0][1])/2+(shade-1)*407,origin={x:198,y:178};
 let beam=c.createLinearGradient(origin.x,origin.y,dest,ground);beam.addColorStop(0,'rgba(255,219,144,.46)');beam.addColorStop(.88,'rgba(255,207,116,.20)');beam.addColorStop(1,'rgba(255,213,118,.32)');
 poly(c,[[origin.x-3,origin.y],[origin.x+5,origin.y-4],[dest+108,ground+7],[dest-108,ground+7]],beam);ellipse(c,dest,ground+5,103,5,'#ffe3a333');
 for(let i=0;i<15;i++){const a=((i*.053+t*.14)%1);const x=origin.x+(dest-origin.x)*a+Math.sin(i*17)*a*75;ellipse(c,x,origin.y+(ground-origin.y)*a,1.1,1.7,'#ffe9ab99');}
 bridge(1);bridge(2);
 character(145,148,.94,mode!=='record',0);
 c.save();c.translate(origin.x,origin.y);c.rotate(Math.atan2(ground-origin.y,dest-origin.x)-Math.PI/2);poly(c,[[-5,-9],[5,-9],[11,4],[-11,4]],'#c29455');ellipse(c,0,4,10,3,'#ffedb0');c.restore();
 const sw=mode==='win'?Math.sin((t-ringTime)*14)*Math.exp(-(t-ringTime)*1.4)*.55:Math.sin(t*1.5)*.035;c.save();c.translate(1025,276);c.rotate(sw);stroke(c,[[0,0],[0,10]],'#e9d3a0');poly(c,[[-5,12],[0,8],[5,12],[8,21],[-8,21]],'#f5cd7a');stroke(c,[[0,21],[0,30]],'#e3b573');poly(c,[[-1,29],[3,30],[2,39],[-2,38]],'#d4634c');c.restore();
 // The small detour is visible on the safe stone island.
 stroke(c,[[497,ground-2],[497,ground-61],[555,ground-61]],'#493b37',4);
 poly(c,[[483,ground-61],[507,ground-76],[550,ground-76],[568,ground-61]],'#445759');
 stroke(c,[[483,ground-61],[568,ground-61]],'#b29b77',2);
 if(!hasBoat){const by=ground-31;poly(c,[[521,by],[527,by+6],[540,by+6],[546,by]],'#f1deb7');poly(c,[[529,by],[537,by-7],[537,by]],'#fff1c9');stroke(c,[[513,by+8],[550,by+8]],'#987f61',2);}
 let y=ground-3;if(mode==='fall')y+=Math.min(100,fallTime*fallTime*290);
 if(boatTrip>0)y-=24*Math.sin(Math.PI*boatTrip/1.4);
 character(player,y,1.1,false,mode==='walk'?walkPhase:0,direction);
 if(mode==='fall'&&fallTime>.4){c.strokeStyle='#c2d9d7';c.lineWidth=1.5;c.beginPath();c.ellipse(player,ground+46,fallTime*37,4,0,0,Math.PI*2);c.stroke();}
 if(mode==='edit'&&fault){c.fillStyle='#f7b08a';c.font='14px sans-serif';c.textAlign='center';c.fillText('↓ '+fault.time.toFixed(1)+'s',fault.x,ground-64);}
 if(mode==='win'){for(let i=0;i<18;i++){const a=(i*.062+(t-ringTime)*.18)%1;ellipse(c,1025+Math.sin(i*14+a*3)*64*a,286-a*87,1.8,1.8,'#ffe8a9');}}
 for(let i=0;i<44;i++){const x=(i*163+W-(t*14)%W)%W,y=(i*67+t*125)%(H+20)-10;stroke(c,[[x,y],[x-2,y+7]],'#d5e9ed31',.8);}
 const active=['record','walk','fall','win','replay'].includes(mode);$('cursor').hidden=!active;$('cursor').style.left=Math.min(99.9,elapsed/limit*100)+'%';$('clock').textContent=elapsed.toFixed(1)+' / 8.0 秒';
}
function loop(stamp){const dt=lastStamp?Math.min(.08,(stamp-lastStamp)/1000):0;lastStamp=stamp;if(!paused){let remaining=dt;while(remaining>.00001){const slice=Math.min(remaining,1/90);update(slice);remaining-=slice;}}draw();requestAnimationFrame(loop);}
show();requestAnimationFrame(loop);
