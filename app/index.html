      /* What a slow connection shows until the game arrives: the night, then the seal. */
      body { margin: 0; background: #0f1f25 }

      .boot i { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 4px; background: #c9553f; color: #f6e7d2; font: normal 32px/1 'Songti SC', STSong, SimSun, serif; letter-spacing: 0; text-indent: 0; transform: rotate(-4deg) }
